version: "3.8"

services:
  backend:
    container_name: FM_backend
    restart: unless-stopped
    build:
      context: ./backend
      network: host
    ports:
      - 8000:8000
    volumes:
      - ./uploads:/app/uploads

  frontend:
    container_name: FM_frontend
    restart: unless-stopped
    build: ./frontend
    depends_on:
      - backend
    ports:
      - 80:80

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - 9090:9090

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/snap/docker/common/var-lib-docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - 8080:8080

volumes:
  prom_data: